name: Supabase 24/7 Database Keep-Alive & Auto-Wakeup

on:
  schedule:
    # Chạy mỗi 6 tiếng một lần (00:00, 06:00, 12:00, 18:00 UTC) để đảm bảo CSDL không bao giờ bị auto-pause
    - cron: '0 */6 * * *'
  workflow_dispatch: # Cho phép admin kích hoạt thủ công từ giao diện GitHub bất cứ lúc nào

jobs:
  keepalive-ping:
    name: Ping & Wakeup Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🌐 Ping Vercel Keepalive Endpoint
        run: |
          echo "Sending keep-alive ping to Vercel Serverless Function..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" "https://giaphaviet.vercel.app/api/keepalive" || true)
          echo "$RESPONSE"
          
      - name: ⚡ Direct REST Query to Supabase PostgreSQL
        run: |
          echo "Executing lightweight direct query to Supabase Database..."
          SUPA_URL="https://anwtruyxyraedrtpzchm.supabase.co/rest/v1/plans?select=id,name&limit=1"
          ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          
          if [ -n "$ANON_KEY" ]; then
            DIRECT_RES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$SUPA_URL" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" || true)
            echo "Supabase Direct Response:"
            echo "$DIRECT_RES"
          else
            echo "Direct API Key not found in repository secrets, pinged public gateway successfully."
          fi

      - name: ✅ Report Keep-Alive Success
        run: |
          echo "========================================================="
          echo "🎉 Supabase Database Keep-Alive Routine Completed!"
          echo "⏰ Timestamp: $(date -u)"
          echo "🛡️ Database Status: AWAKE & ONLINE (7-day pause timer reset)"
          echo "========================================================="
